spring.application.name=smart-parking
server.port=${PORT:8081}

# Default Database: H2 In-Memory (Zero configuration required, runs instantly anywhere)
spring.datasource.url=jdbc:h2:mem:smart_parking;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
app.jwt.secret=local-development-only-secret-change-before-deploy
app.admin.password=${ADMIN_PASSWORD:}
app.cors.allowed-origins=http://localhost:8080,http://localhost:8081,https://amanchaurasia081-sketch.github.io

# H2 Web Console (Open http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
